<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · gitbackup</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%232458c6'/><path d='M4 5h8v7H4z' fill='none' stroke='white' stroke-width='1.5'/><path d='M6 5V3.5h4V5' fill='none' stroke='white' stroke-width='1.5'/></svg>">
<style>
  .login { max-width: 360px; margin: 12vh auto 0; padding: 0 16px; }
  .login .brand { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 18px; }
  .login .brand span { color: var(--accent); }
  .login form { display: flex; flex-direction: column; gap: 12px; }
  .login label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .login input { font-size: 15px; padding: 9px 11px; }
  .login button { padding: 9px; font-size: 15px; }
</style>
</head>
<body>
<div class="login">
  <div class="brand">git<span>backup</span></div>
  <div class="card">
    {{if .Error}}<div class="flash err" style="margin-bottom:12px">{{.Error}}</div>{{end}}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{.Next}}">
      <label>User
        <input type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus value="{{.User}}">
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="primary" type="submit">Sign in</button>
    </form>
  </div>
  {{if not .Secure}}<p class="help" style="text-align:center;margin-top:14px">Plain HTTP – the password travels unencrypted. HTTPS can be turned on in Settings.</p>{{end}}
</div>
</body>
</html>
